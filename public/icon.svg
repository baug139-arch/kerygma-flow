<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="45%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Outer Rim Stroke -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1" />
    </linearGradient>

    <!-- Royal Amber/Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Dark Gold Shadow -->
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Divine Stage Light Beam -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle Deep Obsidian Background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="116" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Heavenly Stage Light Cone from Peak -->
  <polygon points="256,65 110,430 402,430" fill="url(#beamGrad)" />

  <!-- Star of Truth at the Peak of the Amvon -->
  <circle cx="256" cy="115" r="4.5" fill="#ffffff" filter="url(#glow)" />
  <path d="M 256 95 L 256 135 M 236 115 L 276 115" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

  <!-- ================= AMVON ARCHITECTURE / LETTER "A" MONOGRAM ================= -->
  
  <!-- Left Ascending Pillar of "A" -->
  <path d="M 256 150 L 235 150 L 165 375 L 195 375 L 250 190 Z" fill="url(#goldGrad)" />

  <!-- Right Ascending Pillar of "A" -->
  <path d="M 256 150 L 277 150 L 347 375 L 317 375 L 262 190 Z" fill="url(#goldGrad)" opacity="0.95" />

  <!-- The Open Word of God (Horizontal Crossbar of "A" & Reading Desk) -->
  <!-- Left Page -->
  <path d="M 256 265 C 220 248, 185 252, 160 264 L 160 305 C 185 293, 220 289, 256 306 Z"
        fill="url(#goldGrad)" />
  
  <!-- Right Page -->
  <path d="M 256 265 C 292 248, 327 252, 352 264 L 352 305 C 327 293, 292 289, 256 306 Z"
        fill="url(#goldGrad)" opacity="0.9" />

  <!-- Center Book Spine Line -->
  <path d="M 256 265 L 256 306" stroke="#fffbeb" stroke-width="3" stroke-linecap="round" />

  <!-- ================= 3 ASCENDING STEPS OF THE AMVON (ВОСХОЖДЕНИЕ НА АМВОН) ================= -->
  
  <!-- Top Step (Step 1) -->
  <rect x="185" y="385" width="142" height="10" rx="5" fill="url(#goldGrad)" />
  
  <!-- Middle Step (Step 2) -->
  <rect x="160" y="405" width="192" height="12" rx="6" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Broad Foundation Step (Step 3) -->
  <rect x="135" y="427" width="242" height="14" rx="7" fill="url(#goldGrad)" opacity="0.7" />
  <rect x="160" y="429" width="192" height="3" rx="1.5" fill="#fde68a" opacity="0.5" />
</svg>
